<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقع حنين</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #2c2523 0%, #1a1514 100%);
      color: #e0d7d5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .container {
      text-align: center;
      width: 90%;
      max-width: 380px;
      padding: 30px 20px;
      background: #241e1c;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      border: 1px solid #423632;
    }

    .mother-img {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 15px;
      margin-bottom: 15px;
      border: 1px solid #5a4a45;
    }

    .header-title {
      font-size: 1.8rem;
      font-weight: bold;
      color: #d4af37;
      margin-bottom: 15px;
    }

    .hidden {
      display: none !important;
    }

    .btn {
      background: linear-gradient(45deg, #c59b27, #8e6d17);
      color: #fff;
      border: none;
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(197, 155, 39, 0.3);
      transition: all 0.3s ease;
      margin-top: 15px;
      outline: none;
      width: 100%;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .player-box {
      position: relative;
      width: 220px;
      height: 220px;
      margin: 20px auto;
      background: #1a1514;
      border-radius: 20px;
      padding: 15px;
      border: 1px solid #3d312e;
      box-shadow: inset 0 0 10px #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .record {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: repeating-radial-gradient(
        circle,
        #111,
        #111 5px,
        #222 6px,
        #222 7px
      );
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.8);
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .record-label {
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, #c59b27 0%, #8e6d17 100%);
      border-radius: 50%;
      border: 3px solid #111;
      position: relative;
    }

    .tone-arm {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 55px;
      height: 65px;
      border-right: 4px solid #c59b27;
      border-top: 4px solid #c59b27;
      border-radius: 0 15px 0 0;
      transform-origin: top right;
      transform: rotate(-30deg);
      transition: transform 0.8s ease-in-out;
      pointer-events: none;
      z-index: 10;
    }

    .spinning {
      animation: spinRecord 2.5s linear infinite !important;
    }

    .arm-active {
      transform: rotate(10deg) !important;
    }

    @keyframes spinRecord {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    #statusText {
      margin-top: 10px;
      font-size: 0.85rem;
      color: #e74c3c;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div id="screen1" class="container">
    <img class="mother-img" src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?q=80&w=600&auto=format&fit=crop" alt="ابن يقبل يد امه">
    <div class="header-title">أهلاً بكِ حنين</div>
    <button class="btn" onclick="startApp()">اضغطي هنا حجيه</button>
  </div>

  <div id="screen2" class="container hidden">
    <div class="header-title">احبچ امي</div>

    <div class="player-box">
      <div id="arm" class="tone-arm"></div>
      <div id="vinylRecord" class="record">
        <div class="record-label"></div>
      </div>
    </div>

    <button id="playBtn" class="btn" onclick="toggleAudio()">تشغيل الموسيقى</button>
    <div id="statusText"></div>
  </div>

  <audio id="myAudio" src="song.mp3" preload="auto" playsinline webkit-playsinline></audio>

  <script>
    var audio = document.getElementById('myAudio');
    var record = document.getElementById('vinylRecord');
    var arm = document.getElementById('arm');
    var btn = document.getElementById('playBtn');
    var statusText = document.getElementById('statusText');

    function startApp() {
      document.getElementById('screen1').classList.add('hidden');
      document.getElementById('screen2').classList.remove('hidden');
      
      audio.play().then(function() {
        audio.pause();
      }).catch(function(e) {
        console.log("Audio prep:", e);
      });
    }

    function toggleAudio() {
      statusText.innerText = "";
      if (audio.paused) {
        var playPromise = audio.play();
        
        if (playPromise !== undefined) {
          playPromise.then(function() {
            record.classList.add('spinning');
            arm.classList.add('arm-active');
            btn.innerText = "إيقاف الموسيقى";
          }).catch(function(error) {
            console.log("Error:", error);
            statusText.innerText = "تعذر العثور على ملف song.mp3 أو تشغيله.";
          });
        }
      } else {
        audio.pause();
        record.classList.remove('spinning');
        arm.classList.remove('arm-active');
        btn.innerText = "تشغيل الموسيقى";
      }
    }
  </script>

</body>
</html>
